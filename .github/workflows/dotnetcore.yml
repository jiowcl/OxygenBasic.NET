name: .NET

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-x86:
    name: Windows x86 (build + test)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Build
      run: dotnet build OxygenBasic.NET.sln --configuration Release -p:Platform=x86

    - name: Test (net8 / net9 / net10)
      run: >
        dotnet test OxygenBasic.NETTests/OxygenBasic.NETTests.csproj
        --configuration Release
        -p:Platform=x86
        --no-build
        --verbosity normal

    - name: Run hosted example (net10)
      shell: pwsh
      run: |
        $dll = "OxygenBasic.Example/bin/x86/Release/net10.0-windows/OxygenBasic.Example.dll"
        if (-not (Test-Path $dll)) { throw "Example not found: $dll" }
        $dotnetX86 = Join-Path ${env:ProgramFiles(x86)} "dotnet\dotnet.exe"
        if (-not (Test-Path $dotnetX86)) {
          throw "x86 dotnet host not found at $dotnetX86 (required to run PlatformTarget=x86)"
        }
        "" | & $dotnetX86 exec $dll

  build-x64:
    name: Windows x64 (build)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Build
      run: dotnet build OxygenBasic.NET.sln --configuration Release -p:Platform=x64

    # Current upstream oxygen64.dll raises ACCESS_VIOLATION inside DllMain on LoadLibrary
    # on Windows runners. Keep the x64 build green; re-enable tests when a fixed native
    # binary is available.
    - name: Skip native tests (oxygen64 LoadLibrary AV)
      shell: pwsh
      run: |
        Write-Host "x64 managed build OK."
        Write-Host "Native tests skipped: bundled oxygen64.dll faults on LoadLibrary (0xC0000005)."
        Write-Host "DllImport resolver is in place for oxygen64.dll when a working binary is shipped."
