name: .NET

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-x86:
    name: Windows x86 (build + test)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET x64 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
        architecture: x64

    # setup-dotnet architecture:x86 does not always lay down every Microsoft.NETCore.App
    # x86 runtime (net9 was missing → testhost.x86.exe failed). Install runtimes explicitly.
    - name: Install .NET x86 runtimes (8 / 9 / 10)
      shell: pwsh
      run: |
        $installDir = Join-Path ${env:ProgramFiles(x86)} "dotnet"
        Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile ".\dotnet-install.ps1"
        foreach ($channel in @("8.0", "9.0", "10.0")) {
          Write-Host "Installing Microsoft.NETCore.App $channel (x86) -> $installDir"
          .\dotnet-install.ps1 -Channel $channel -Runtime dotnet -Architecture x86 -InstallDir $installDir
        }
        Write-Host "Installed x86 frameworks:"
        Get-ChildItem (Join-Path $installDir "shared\Microsoft.NETCore.App") | ForEach-Object { $_.Name }

    - name: Build
      run: dotnet build OxygenBasic.NET.sln --configuration Release -p:Platform=x86

    - name: Test (net8 / net9 / net10)
      shell: pwsh
      run: |
        $dotnetRootX86 = Join-Path ${env:ProgramFiles(x86)} "dotnet"
        [Environment]::SetEnvironmentVariable("DOTNET_ROOT(x86)", $dotnetRootX86)
        Write-Host "DOTNET_ROOT(x86)=$([Environment]::GetEnvironmentVariable('DOTNET_ROOT(x86)'))"
        $frameworks = @("net8.0-windows", "net9.0-windows", "net10.0-windows")
        foreach ($tfm in $frameworks) {
          Write-Host "::group::dotnet test $tfm"
          dotnet test OxygenBasic.NETTests/OxygenBasic.NETTests.csproj `
            --configuration Release `
            -p:Platform=x86 `
            --framework $tfm `
            --no-build `
            --verbosity normal
          if ($LASTEXITCODE -ne 0) { throw "Tests failed for $tfm" }
          Write-Host "::endgroup::"
        }

    - name: Run hosted example (net10)
      shell: pwsh
      run: |
        $dotnetRootX86 = Join-Path ${env:ProgramFiles(x86)} "dotnet"
        $dotnetX86 = Join-Path $dotnetRootX86 "dotnet.exe"
        $dll = "OxygenBasic.Example/bin/x86/Release/net10.0-windows/OxygenBasic.Example.dll"
        if (-not (Test-Path $dll)) { throw "Example not found: $dll" }
        [Environment]::SetEnvironmentVariable("DOTNET_ROOT(x86)", $dotnetRootX86)
        "" | & $dotnetX86 exec $dll

  build-x64:
    name: Windows x64 (build)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
        architecture: x64

    - name: Build
      run: dotnet build OxygenBasic.NET.sln --configuration Release -p:Platform=x64

    # oxygen64.dll is official PE32+ from OxygenBasic, but DllMain(PROCESS_ATTACH)
    # AVs (0xC0000005) on current Windows 11 — reproduced with native MSVC LoadLibraryW
    # as well as .NET. Re-enable tests when upstream ships a fixed binary.
    - name: Skip native tests (oxygen64 DllMain AV)
      shell: pwsh
      run: |
        Write-Host "x64 managed build OK; oxygen.dll/oxygen64.dll both packaged."
        Write-Host "Native tests skipped: oxygen64.dll DllMain ACCESS_VIOLATION on LoadLibrary."
        Write-Host "See docs/oxygen64-x64-runtime.md"
