name: .NET

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-x86:
    name: Windows x86 (build + test)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # x64 SDK for building; x86 host/runtime required to execute PlatformTarget=x86
    # test hosts (otherwise hostfxr.dll fails with 0x800700C1 BAD_EXE_FORMAT).
    - name: Setup .NET x64
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
        architecture: x64

    - name: Setup .NET x86
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
        architecture: x86

    - name: Resolve x86 dotnet host
      id: dotnet-x86
      shell: pwsh
      run: |
        $dotnetRootX86 = Join-Path ${env:ProgramFiles(x86)} "dotnet"
        $dotnetX86 = Join-Path $dotnetRootX86 "dotnet.exe"
        if (-not (Test-Path $dotnetX86)) {
          throw "x86 dotnet host not found at $dotnetX86"
        }
        & $dotnetX86 --info
        "dotnet-x86=$dotnetX86" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "dotnet-root-x86=$dotnetRootX86" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Build
      run: dotnet build OxygenBasic.NET.sln --configuration Release -p:Platform=x86

    - name: Test (net8 / net9 / net10)
      shell: pwsh
      env:
        DOTNET_ROOT: ${{ steps.dotnet-x86.outputs.dotnet-root-x86 }}
      run: |
        # 32-bit testhost must load x86 hostfxr (not Program Files\dotnet x64).
        [Environment]::SetEnvironmentVariable("DOTNET_ROOT(x86)", $env:DOTNET_ROOT)
        & "${{ steps.dotnet-x86.outputs.dotnet-x86 }}" test OxygenBasic.NETTests/OxygenBasic.NETTests.csproj `
          --configuration Release `
          -p:Platform=x86 `
          --no-build `
          --verbosity normal

    - name: Run hosted example (net10)
      shell: pwsh
      env:
        DOTNET_ROOT: ${{ steps.dotnet-x86.outputs.dotnet-root-x86 }}
      run: |
        [Environment]::SetEnvironmentVariable("DOTNET_ROOT(x86)", $env:DOTNET_ROOT)
        $dll = "OxygenBasic.Example/bin/x86/Release/net10.0-windows/OxygenBasic.Example.dll"
        if (-not (Test-Path $dll)) { throw "Example not found: $dll" }
        "" | & "${{ steps.dotnet-x86.outputs.dotnet-x86 }}" exec $dll

  build-x64:
    name: Windows x64 (build)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
        architecture: x64

    - name: Build
      run: dotnet build OxygenBasic.NET.sln --configuration Release -p:Platform=x64

    # oxygen64.dll is official PE32+ from OxygenBasic, but DllMain(PROCESS_ATTACH)
    # AVs (0xC0000005) on current Windows 11 — reproduced with native MSVC LoadLibraryW
    # as well as .NET. Re-enable tests when upstream ships a fixed binary.
    - name: Skip native tests (oxygen64 DllMain AV)
      shell: pwsh
      run: |
        Write-Host "x64 managed build OK; oxygen.dll/oxygen64.dll both packaged."
        Write-Host "Native tests skipped: oxygen64.dll DllMain ACCESS_VIOLATION on LoadLibrary."
        Write-Host "See docs/oxygen64-x64-runtime.md"
